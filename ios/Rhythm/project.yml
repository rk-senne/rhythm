# XcodeGen spec for Rhythm.
#
# Regenerate the Xcode project any time with:
#     xcodegen generate        (run from ios/Rhythm/)
#
# This file is the source of truth for the project structure — never hand-edit
# Rhythm.xcodeproj; edit this and regenerate. See docs/XCODE_SETUP.md.
#
# NOTE: Replace DEVELOPMENT_TEAM and the com.rhythm.app bundle-ID prefix with
# your own before archiving for the App Store.

name: Rhythm

options:
  bundleIdPrefix: com.rhythm.app
  deploymentTarget:
    iOS: "17.0"
    watchOS: "10.0"
  createIntermediateGroups: true
  groupSortPosition: top
  generateEmptyDirectories: true

settings:
  base:
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
    SWIFT_VERSION: "5.9"
    DEVELOPMENT_TEAM: "" # TODO: set your 10-char Apple Developer Team ID
    CODE_SIGN_STYLE: Automatic
    GENERATE_INFOPLIST_FILE: NO # we supply explicit Info via `info:` blocks
    ENABLE_MODULE_VERIFIER: NO

packages:
  ComposableArchitecture:
    url: https://github.com/pointfreeco/swift-composable-architecture
    exactVersion: "1.17.0"
  RevenueCat:
    url: https://github.com/RevenueCat/purchases-ios
    from: "5.0.0"

targets:
  # ------------------------------------------------------------------ iOS app
  Rhythm:
    type: application
    platform: iOS
    sources:
      - path: App
      - path: Core
      - path: Features
      - path: Config/Assets.xcassets
    dependencies:
      - package: ComposableArchitecture
        product: ComposableArchitecture
      - package: RevenueCat
        product: RevenueCat
      - target: RhythmWidgets
        embed: true
      - target: RhythmWatch
        embed: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.rhythm.app
        CODE_SIGN_ENTITLEMENTS: Config/Rhythm.entitlements
        TARGETED_DEVICE_FAMILY: "1,2"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
    info:
      path: Config/Info-App.plist
      properties:
        CFBundleDisplayName: Rhythm
        UILaunchScreen: {}
        UIApplicationSupportsIndirectInputEvents: true
        NSSupportsLiveActivities: true
        NSHealthShareUsageDescription: "Rhythm reads your water intake so hydration progress stays in sync with the Health app."
        NSHealthUpdateUsageDescription: "Rhythm logs the water you drink during a ritual to the Health app."
        NSCalendarsUsageDescription: "Rhythm shows your meetings alongside focus blocks."
        NSCalendarsFullAccessUsageDescription: "Rhythm shows meetings alongside focus blocks and can suggest focus times in your free gaps."
        NSMicrophoneUsageDescription: "Record a quick spoken reflection during your transition ritual."
        NSSpeechRecognitionUsageDescription: "Transcribe your spoken reflection on device."
        UIBackgroundModes:
          - processing
          - remote-notification
        BGTaskSchedulerPermittedIdentifiers:
          - com.rhythm.app.refresh
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait

  # ------------------------------------------------------- Widget extension
  RhythmWidgets:
    type: app-extension
    platform: iOS
    sources:
      - path: Widgets
      # Live Activity attributes/UI are shared with the app target: the same
      # file must be a member of BOTH targets so ActivityKit can match them.
      - path: Features/Timer/FocusSessionLiveActivity.swift
      # Shared App Group progress store (also compiled into the app target).
      - path: Core/SharedProgress.swift
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.rhythm.app.widgets
        CODE_SIGN_ENTITLEMENTS: Config/RhythmWidgets.entitlements
    info:
      path: Config/Info-Widgets.plist
      properties:
        CFBundleDisplayName: Rhythm
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension

  # --------------------------------------------------------------- Watch app
  RhythmWatch:
    type: application
    platform: watchOS
    sources:
      - path: Watch
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.rhythm.app.watchkitapp
        CODE_SIGN_ENTITLEMENTS: Config/RhythmWatch.entitlements
    info:
      path: Config/Info-Watch.plist
      properties:
        CFBundleDisplayName: Rhythm
        WKApplication: true
        WKCompanionAppBundleIdentifier: com.rhythm.app

  # ------------------------------------------------------------- Unit tests
  RhythmTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: Tests
    dependencies:
      - target: Rhythm
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.rhythm.app.RhythmTests

schemes:
  Rhythm:
    build:
      targets:
        Rhythm: all
        RhythmWidgets: all
        RhythmWatch: all
    run:
      config: Debug
    test:
      config: Debug
      gatherCoverageData: true
      targets:
        - RhythmTests
    profile:
      config: Release
    analyze:
      config: Debug
    archive:
      config: Release

  RhythmWatch:
    build:
      targets:
        RhythmWatch: all
    run:
      config: Debug
